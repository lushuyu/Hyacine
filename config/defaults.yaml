# config/defaults.yaml
# Generic defaults — copy to config/config.yaml and tune.
# Or run `python -m hyacine init` to generate automatically.

# REQUIRED — your delivery address (the wizard will set this for you)
recipient_email: ""

# IANA timezone identifier, e.g. "America/New_York", "Europe/London", "Asia/Tokyo"
# Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: UTC

# Output language for the report email: "en" (English) or "zh-CN" (Simplified Chinese)
language: en

# Model id passed to the active LLM provider. The `claude` CLI also accepts
# short aliases like opus / sonnet / haiku; HTTP providers need a full id.
llm_model: claude-opus-5-5

# Time of day to send the report (HH:MM in the configured timezone).
# The systemd timer is not generated from this value: edit OnCalendar in
# hyacine-run.timer to match, then `systemctl --user daemon-reload`.
run_time: "07:30"

# Subprocess timeout for `claude -p` (seconds). Increase for very large mailboxes.
llm_timeout_seconds: 300

# Most emails one run hands to the LLM: the newest N in the watermark window.
# Anything older is left out, logged as a WARN, and the digest says so at the
# top. The fetch itself stops at 1000 messages regardless.
fetch_max_emails: 500

# First-run watermark: if the DB has no last_successful_run_at, pretend the last
# success was N hours ago so we don't attempt to fetch the entire mailbox.
initial_watermark_lookback_hours: 24
