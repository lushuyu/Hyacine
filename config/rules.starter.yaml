# config/rules.starter.yaml
# Generic starter rules — copy to config/rules.yaml (or $HYACINE_RULES_PATH)
# and customise. Or run `python -m hyacine init` which copies this file
# automatically.
#
# Rules are evaluated top-to-bottom; the FIRST match wins.
# Each rule needs a `name`, a `category`, and at least one matcher:
#   sender_domain:  case-insensitive SUBSTRING match against the sender domain
#                   ("github.com" also matches "noreply.github.com")
#   sender_email:   case-insensitive SUBSTRING match against the sender address
#                   ("noreply@" matches any noreply@ sender; even a full address
#                   such as "bob@example.com" also matches "jbob@example.com")
#   subject_regex:  Python re.search pattern, case-insensitive; it matches
#                   anywhere in the subject unless anchored with ^ (use
#                   \b...\b for whole words). An invalid pattern is
#                   rejected when the file is loaded
# A rule with multiple matchers requires ALL matchers to match.
# An empty matcher ("") counts as unset; a rule with no matchers matches nothing.
#
# Categories (any other value fails validation):
#   priority | action_required | meeting | calendar | github | ci |
#   newsletter | marketing | receipt | review | advisor | grad_school |
#   arxiv | scholar | cfp | canvas | admin | other

rules:
  # --- High-priority senders ---
  - name: advisor-or-manager
    subject_regex: '(urgent|action required|please review|approval needed)'
    category: priority

  # Uncomment and fill in to pin a specific sender (e.g. your manager):
  # - name: priority-direct-report
  #   sender_email: manager@example.com
  #   category: priority

  # --- Action-required ---
  - name: action-required-subject
    subject_regex: '\b(action required|response needed|deadline|due today|overdue)\b'
    category: action_required

  # --- Meeting invites ---
  # Not "you're invited" / "join us for": those are webinar and promo phrasing.
  # "Invitation:" at the start is how Google Calendar invites arrive.
  - name: meeting-invite
    subject_regex: '\b(meeting invite|meeting invitation|calendar invite)\b|^\s*invitation\s*:'
    category: meeting

  # Meeting responses and changes ("Accepted: Weekly sync"). Anchored to the
  # start so "Your card payment was declined" stays out.
  - name: calendar-event
    subject_regex: '^\s*(accepted|declined|tentative|tentatively accepted|canceled|cancelled|canceled event|cancelled event|updated invitation)\s*:'
    category: calendar

  # --- GitHub notifications ---
  - name: github-notifications
    sender_domain: github.com
    category: github

  - name: github-noreply
    sender_domain: noreply.github.com
    category: github

  # --- CI / CD alerts ---
  - name: ci-failure
    subject_regex: '\b(build failed|pipeline failed|test failed|deployment failed)\b'
    category: ci

  # --- Newsletters & digests ---
  # Not "weekly update": colleagues use it for real status mail.
  - name: newsletter-subject
    subject_regex: '\b(newsletters?|weekly digest|monthly digest|roundup)\b'
    category: newsletter

  - name: newsletter-unsubscribe
    subject_regex: 'unsubscribe'
    category: newsletter

  # --- Receipts & billing ---
  # Before marketing, so a receipt that also advertises a discount stays a receipt.
  - name: receipt-or-invoice
    subject_regex: '\b(receipt|invoice|order confirmation|payment confirmation|billing statement)\b'
    category: receipt

  # --- Marketing ---
  # No sender-only noreply@ rule: security alerts, banks and universities send
  # from noreply@ too. To catch noreply promos, pair sender_email with a
  # promo subject_regex in the same rule.
  # Not "offer" / "deal": "Offer of Admission", "deal with this".
  - name: marketing-promo
    subject_regex: '\b(sale|\d+\s?% off|discounts?|promos?|coupons?|limited[- ]time)\b'
    category: marketing

  # --- Review requests ---
  - name: review-invite
    subject_regex: '\b(please review|review requested|pull request|code review)\b'
    category: review
